openapi: 3.1.1
info:
  title: Hackathon Givaudan — API applicative du socle
  version: 0.1.0
  description: >-
    Contrat des routes actuellement implémentées dans api/src/index.ts.
    Le formulaire de test interroge un fournisseur IA et conserve l’échange
    dans PostgreSQL. Les routes métier de brief et de commande restent à concevoir.
servers:
  - url: http://localhost:3000
    description: API Express locale ; le front Vite utilise son proxy /api.
tags:
  - name: Santé
  - name: Questions de démonstration
paths:
  /api/health:
    get:
      operationId: lireSante
      tags: [Santé]
      summary: Vérifier la connexion à PostgreSQL
      responses:
        '200':
          description: PostgreSQL répond ; sa version réelle est renvoyée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
              example:
                status: ok
                db: PostgreSQL 17
        '500':
          $ref: '#/components/responses/ErreurInterne'
  /api/questions:
    get:
      operationId: listerQuestions
      tags: [Questions de démonstration]
      summary: Lire les dix derniers échanges au maximum
      description: Tri par identifiant décroissant, du plus récent au plus ancien.
      responses:
        '200':
          description: Liste éventuellement vide des échanges enregistrés.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Echange'
              example:
                - id: 1
                  question: Quelle est la capitale du Canada ?
                  answer: Ottawa.
                  created_at: '2026-11-10T12:00:00.000Z'
        '500':
          $ref: '#/components/responses/ErreurInterne'
    post:
      operationId: creerQuestion
      tags: [Questions de démonstration]
      summary: Obtenir une réponse IA puis enregistrer l’échange
      description: >-
        La question est trimée avant l’appel IA. Une chaîne vide après trim est
        rejetée. Le serveur attend la réponse complète, avec une limite de 60 s
        pour l’appel au fournisseur, puis insère l’échange dans PostgreSQL.
        Aucun échange n’est inséré si le fournisseur échoue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NouvelleQuestion'
            example:
              question: Quelle est la capitale du Canada ?
      responses:
        '201':
          description: Réponse obtenue et échange enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Echange'
              example:
                id: 1
                question: Quelle est la capitale du Canada ?
                answer: Ottawa.
                created_at: '2026-11-10T12:00:00.000Z'
        '400':
          description: Question absente, non textuelle ou vide après trim ; JSON invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              examples:
                questionManquante:
                  value:
                    error: 'Question manquante : saisir une question.'
                jsonInvalide:
                  value:
                    error: Corps JSON invalide.
        '500':
          $ref: '#/components/responses/ErreurInterne'
        '502':
          description: Refus HTTP du fournisseur ou réponse JSON/textuelle inexploitable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                error: 'L’IA n’a pas renvoyé de réponse textuelle.'
        '503':
          description: Fournisseur non configuré ou injoignable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                error: 'Ollama est injoignable. Vérifier son démarrage et AI_BASE_URL.'
        '504':
          description: L’appel au fournisseur a dépassé 60 secondes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                error: 'L’IA n’a pas répondu dans les 60 secondes. Réessayer.'
components:
  schemas:
    Sante:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          const: ok
        db:
          type: string
          description: Résultat de SELECT version() sur PostgreSQL.
    NouvelleQuestion:
      type: object
      required: [question]
      additionalProperties: true
      properties:
        question:
          type: string
          minLength: 1
          pattern: '\S'
          description: Au moins un caractère non blanc ; les espaces de bord sont retirés.
    Echange:
      type: object
      required: [id, question, answer, created_at]
      properties:
        id:
          type: integer
          format: int32
        question:
          type: string
        answer:
          type: string
        created_at:
          type: string
          format: date-time
    Erreur:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    ErreurInterne:
      description: Échec de requête SQL ou autre erreur interne ; détail journalisé côté serveur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            error: Impossible de traiter la demande.
