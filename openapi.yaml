openapi: 3.1.1
info:
  title: Hackathon Givaudan — API applicative
  version: 0.2.0
  description: >-
    Contrat des routes implémentées dans l'API NestJS.
    Expose les routes de démonstration (santé, questions) et le relais vers
    l'assistant Python (conversation) pour la création de briefs.
servers:
  - url: http://localhost:3000
    description: API NestJS locale ; le front Vite utilise son proxy /api.
tags:
  - name: Santé
  - name: Questions de démonstration
  - name: Conversation (Data)
paths:
  /api/health:
    get:
      operationId: lireSante
      tags: [Santé]
      summary: Vérifier la connexion à PostgreSQL
      responses:
        '200':
          description: PostgreSQL répond ; sa version réelle est renvoyée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
              example:
                status: ok
                timestamp: '2026-11-12T15:40:05.243Z'
                db: PostgreSQL 17
        '500':
          $ref: '#/components/responses/ErreurInterne'

  /api/questions:
    get:
      operationId: listerQuestions
      tags: [Questions de démonstration]
      summary: Lire les dix derniers échanges au maximum
      description: Tri par identifiant décroissant, du plus récent au plus ancien.
      responses:
        '200':
          description: Liste éventuellement vide des échanges enregistrés.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Echange'
        '500':
          $ref: '#/components/responses/ErreurInterne'
    post:
      operationId: creerQuestion
      tags: [Questions de démonstration]
      summary: Obtenir une réponse IA puis enregistrer l’échange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NouvelleQuestion'
      responses:
        '201':
          description: Réponse obtenue et échange enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Echange'
        '400':
          $ref: '#/components/responses/Erreur400'
        '500':
          $ref: '#/components/responses/ErreurInterne'
        '502':
          $ref: '#/components/responses/Erreur502'
        '503':
          $ref: '#/components/responses/Erreur503'
        '504':
          $ref: '#/components/responses/Erreur504'

  /api/conversation:
    post:
      operationId: relayerConversation
      tags: [Conversation (Data)]
      summary: Relayer un message à l'assistant Python (Data)
      description: >-
        Transmet un message au moteur Python et valide son snapshot complet. Permet de décrire
        un besoin, de choisir une piste d'arôme (via son ID) et de générer un brief.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
            examples:
              descriptionInitiale:
                value:
                  session_id: null
                  message: 'Je souhaite créer une boisson.'
                  piste_id: null
              choixPiste:
                value:
                  session_id: 'session-1234'
                  message: ''
                  piste_id: 'piste-abc-987'
      responses:
        '200':
          description: État de la conversation mis à jour avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          description: Entrée invalide (message trop long, message vide sans piste).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                error: 'Le message est requis si aucune piste_id n’est fournie.'
        '422':
          description: Entrée refusée par Data (400/422), notamment piste devenue invalide ; les pannes Python 5xx ne sont jamais classées en 422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                error: 'Piste inconnue.'
        '500':
          $ref: '#/components/responses/ErreurInterne'
        '502':
          $ref: '#/components/responses/Erreur502'
        '503':
          $ref: '#/components/responses/Erreur503'
        '504':
          $ref: '#/components/responses/Erreur504'

components:
  schemas:
    Sante:
      type: object
      required: [status, timestamp, db]
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
          format: date-time
        db:
          type: string

    NouvelleQuestion:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1

    Echange:
      type: object
      required: [id, question, answer, created_at]
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string
        created_at:
          type: string
          format: date-time

    ConversationRequest:
      type: object
      properties:
        guidage:
          type: boolean
          default: false
          description: Active les questions à choix issues des données Python.
        session_id:
          type: string
          maxLength: 64
          nullable: true
          description: ID de session fourni par le front pour conserver l'état. Null pour démarrer.
        message:
          type: string
          maxLength: 500
          description: Le texte de l'utilisateur. Peut être vide si piste_id est fourni.
        piste_id:
          type: string
          maxLength: 200
          nullable: true
          description: ID de la piste sélectionnée par l'utilisateur.

    ConversationResponse:
      description: Snapshot complet validé par le contrat partagé api/src/contracts/conversation.ts. Les champs additionnels Data sont conservés. En relance ou affiner, les pistes sont vides ; un brief sélectionne une piste existante.
      type: object
      required:
        [
          session_id,
          etape,
          intention,
          reponse,
          compris,
          pistes,
          solutions,
          brief,
          echantillons,
          version_modele,
          attribution,
        ]
      properties:
        session_id:
          type: string
        etape:
          type: string
          enum: [relance, affiner, pistes, recapitulatif, echantillons]
        intention:
          type: string
          enum:
            [
              nouvelle_demande,
              precision,
              question,
              question_piste,
              choix_piste,
              demande_echantillons,
              hors_sujet,
            ]
        reponse:
          type: string
        compris:
          type: object
          additionalProperties: true
          description: Contient notamment `profil` et `volume` (texte avec unité ou null).
        pistes:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Contient notamment `references_sans_label`.
        solutions:
          type: array
          items:
            type: object
        brief:
          type: object
          nullable: true
          additionalProperties: true
          description: Contient notamment `profil`, `volume`, `references_sans_label`.
        echantillons:
          type: object
          nullable: true
          properties:
            statut:
              type: string
              example: brouillon_non_envoye
        questions:
          type: array
          maxItems: 2
          items:
            type: object
            required: [id, question, choix]
            properties:
              id:
                type: string
              question:
                type: string
              choix:
                type: array
                items:
                  type: string
        version_modele:
          type: string
        attribution:
          type: string

    Erreur:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Erreur400:
      description: Requête invalide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            error: Corps JSON invalide.
    Erreur502:
      description: Réponse du fournisseur ou du service Data inexploitable (JSON invalide, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            error: Le service a renvoyé une erreur illisible.
    Erreur503:
      description: Service distant injoignable, en panne (5xx) ou limité (429).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            error: Le service Data est injoignable.
    Erreur504:
      description: Délai d'attente dépassé pour le service distant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            error: Le service n'a pas répondu dans les 30 secondes.
    ErreurInterne:
      description: Échec interne.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            error: Impossible de traiter la demande.
